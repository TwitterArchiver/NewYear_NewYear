<style type="text/css">
body {
				margin:0;
				padding: 20px;
				background-color: #000;

			}
  .notice {
    border: 2px solid #c9ae00;

    padding: 12px;

    top: 20px;
    z-index: 1000;
  }

  .tweet-container {
    font-family: Helvetica, Arial, sans-serif;
    padding: 12px 16px;

    border-radius: 12px;
    margin-top: 20px;

				background-color: white;

    flex-direction: column;
    justify-content: center;
    align-items: center;
    max-width: max-content;
  }

  .tweet-container > #nonjsonview {
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;

  }

  .tweet-author {
    display: flex;
    flex-direction: row;
    align-items: center;
    padding-bottom: 0.75rem;
  }

  .tweet-author-profile-image img {
    width: 48px;
    max-width: 48px;
    height: 48px;
    max-height: 48px;
    overflow: hidden;
    border-radius: 50%;
    margin-right: 5px;
  }

  .tweet-author-info {
    display: flex;
    flex-direction: column;
  }

  .tweet-author-name {
    font-weight: bold;
  }

  .tweet-content {
    font-size: 1.25rem;
  }

			.tweet-image {
				width: 100%;
				height: auto;
				margin-top: 12px;
				border-radius: 12px;
			}

			.embedded-tweet-container {

				border: 1px solid #cfd9de;
    border-radius: 12px;
				background-color: white;
				max-width: 100%;
			}
			.date {
				font-size: 0.75rem;
				color: #657786;
				margin-top: 12px;
			}
			.date a {
				color: #657786;
				text-decoration: none;
			}
			.date a:hover {
				text-decoration: underline;
			}
  .on {
    display: block;
  }
  .off {
    display: none;
  }
</style>
</head>

<div class="tweet-container on">

  我特别害怕我被封号，因为我的账号是用来记录我的所有感受的，我即时的真实想法都会发出来
